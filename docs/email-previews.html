    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; height: 100vh; display: flex; }
    .sidebar { width: 240px; flex-shrink: 0; background: #1e293b; border-right: 1px solid #334155; overflow-y: auto; padding: 20px 0; }
    .sidebar h1 { font-size: 12px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: 1px; padding: 0 16px 14px; border-bottom: 1px solid #334155; margin-bottom: 8px; }
    .sidebar button { display: flex; align-items: center; gap: 10px; width: 100%; padding: 10px 16px; background: none; border: none; color: #94a3b8; font-size: 13px; cursor: pointer; text-align: left; transition: all .15s; border-left: 3px solid transparent; }
    .sidebar button:hover { background: #334155; color: #e2e8f0; }
    .sidebar button.active { background: #14532d22; color: #fff; border-left-color: #16a34a; }
    .sidebar button .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .email-info { background: #1e293b; border-bottom: 1px solid #334155; padding: 12px 24px; display: flex; align-items: center; gap-12px; flex-shrink: 0; }
    .email-meta { display: flex; flex-direction: column; gap: 3px; }
    .badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 8px; border-radius: 9999px; margin-right: 10px; color: #fff; }
    .subject { font-size: 13px; font-weight: 600; color: #e2e8f0; margin-bottom: 3px; }
    .from { font-size: 11px; color: #64748b; }
    .preview-scroll { flex: 1; overflow-y: auto; background: #e5e7eb; padding: 24px; }
    .preview-wrap { max-width: 660px; margin: 0 auto; background: #fff; border-radius: 12px; box-shadow: 0 4px 24px rgba(0,0,0,0.15); overflow: hidden; }
  </style>
</head>

  document.getElementById("from").textContent = e.from;
  document.getElementById("preview").innerHTML = e.html();
  document.querySelectorAll(".sidebar button").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}

// Afficher le premier email au chargement
show(0, document.querySelector(".sidebar button"));
</script>
</body>
